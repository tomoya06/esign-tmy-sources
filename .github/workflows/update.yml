name: Update source

on:
  schedule:
    # 北京时间 9/12/15/18/21/24 点各扫一次（仅检查，版本未变不下载）
    - cron: "0 1,4,7,10,13,16 * * *" # UTC 1/4/7/10/13/16 = 北京时间 9/12/15/18/21/24:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-source
  cancel-in-progress: false

jobs:
  # 1) 从 apps.config.json 动态生成 matrix：每个启用的 App 一个独立 job
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: gen
        run: |
          MATRIX=$(python3 -c "
          import json
          cfg = json.load(open('scripts/apps.config.json'))
          ids = [a.get('id') for a in cfg.get('apps', []) if a.get('enabled') is not False and a.get('id')]
          print(json.dumps({'app': ids}))
          ")
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  # 2) 粒子同步：各 App 并行更新，互不影响
  #    fail-fast: false 保证某个失败不取消其余；timeout 单 App 独立计时
  sync:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Sync ${{ matrix.app }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
        run: python scripts/build.py --only "${{ matrix.app }}" --fragment "out/${{ matrix.app }}.json"

      - name: Upload fragment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: entry-${{ matrix.app }}
          path: out/
          if-no-files-found: error

  # 3) 汇总发布：合并全部片段重建 app.json 并提交
  #    if: always() —— 即使个别 App 失败也照常发布（build.py --merge 会回落旧条目）
  publish:
    needs: [prepare, sync]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Download all fragments
        uses: actions/download-artifact@v4
        with:
          pattern: entry-*
          path: out/
          merge-multiple: true

      - name: Merge fragments into app.json
        run: python scripts/build.py --merge out

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: auto update source $(date -u +%F)"
            git push
          fi
